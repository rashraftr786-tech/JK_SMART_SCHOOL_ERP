name: Build and deploy JK SMART SCHOOLS ERP

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build production site
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      # Reports only whether the secrets are present and whether the URL is valid.
      # It never prints either secret or embeds their values in the log.
      - name: Safely validate Supabase build configuration
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          node --input-type=module <<'NODE'
          const rawUrl = process.env.VITE_SUPABASE_URL ?? '';
          const rawKey = process.env.VITE_SUPABASE_ANON_KEY ?? '';

          let validUrl = false;
          try {
            const parsed = new URL(rawUrl.trim());
            validUrl =
              parsed.protocol === 'https:' &&
              Boolean(parsed.hostname) &&
              !rawUrl.includes('YOUR-PROJECT');
          } catch {
            validUrl = false;
          }

          const keyPresent = rawKey.trim().length > 0;
          const keyHasNoWhitespace = keyPresent && !/\\s/.test(rawKey);

          console.log(`Supabase URL secret present: ${rawUrl.trim() ? 'YES' : 'NO'}`);
          console.log(`Supabase URL is a valid HTTPS URL: ${validUrl ? 'YES' : 'NO'}`);
          console.log(`Supabase anon/publishable key present: ${keyPresent ? 'YES' : 'NO'}`);
          console.log(`Supabase key contains no whitespace: ${keyHasNoWhitespace ? 'YES' : 'NO'}`);

          if (!validUrl || !keyPresent || !keyHasNoWhitespace) {
            console.error('Configuration check failed. Secret values were not displayed.');
            process.exit(1);
          }

          console.log('Supabase build configuration passed the safe format check.');
          NODE

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload production build
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
